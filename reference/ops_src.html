<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EASE Command Centre (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1726;--panel:#152238;--panel2:#1b2b45;--line:#2a3d5c;--ink:#e8edf5;--mute:#9db0c9;--red:#ef5350;--amber:#f2a93b;--blue:#4c9aff;--green:#3fbf7f;--sw:232px}
[data-theme=light]{--bg:#f1f4f9;--panel:#fff;--panel2:#eef2f8;--line:#cbd5e4;--ink:#14213a;--mute:#4d5d78;--red:#c62828;--amber:#9a5b00;--blue:#1a56c4;--green:#1b6e3c}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 'IBM Plex Sans','Inter',-apple-system,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none !important}.grow{flex:1}.mute{color:var(--mute)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100vh}
.app.collapsed{--sw:64px}.app.collapsed .nlabel,.app.collapsed .sbrand span{display:none}
.side{grid-row:1 / -1;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:4px;overflow:auto}
.sbrand{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;font-weight:700;font-size:15px}.sbrand i{font-style:normal;background:var(--red);color:#fff;border-radius:6px;padding:2px 7px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px;min-height:40px;color:var(--mute)}
.nav:hover{background:var(--panel2);color:var(--ink)}.nav[aria-current=page]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--blue);font-weight:600}.nav .ni{width:20px;text-align:center}
.top{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.top button,.top input{min-height:34px}.top button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.top input{width:260px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.brand2{font-size:14px;white-space:nowrap}.pill{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11.5px;white-space:nowrap;background:var(--panel2)}.pill.demo{border-color:var(--amber);color:var(--amber);font-weight:700}
.rel{position:relative}.dot{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;margin-left:4px}
.notif{position:absolute;right:0;top:40px;width:340px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.4)}.notif div{padding:6px;border-bottom:1px solid var(--line)}
main{overflow:auto;padding:14px 16px;min-height:0}
.pg{display:flex;flex-direction:column;gap:12px;min-height:100%}
.h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.h2 h2{margin:0;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left}.kpi:hover{border-color:var(--blue)}.kpi b{font-size:24px;display:block;line-height:1.1}.kpi span{color:var(--mute);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.panel h3{margin:0 0 8px;font-size:13px}
.ovg{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}.ovmap{height:clamp(340px,50vh,640px)}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#dfe5dc;height:100%;min-height:300px}.mapbox svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}.mapctl button{width:34px;height:34px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:16px}
.legend{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.6}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar input,.fld select,.fld input,.fld textarea,#dlg select,#dlg input,#dlg textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:34px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:34px}.btn:hover:not(:disabled){border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}table{width:100%;border-collapse:collapse;font-size:12.5px}th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:8px;color:var(--mute);font-weight:500;white-space:nowrap}td{padding:8px;border-top:1px solid var(--line);vertical-align:top}tr.sel td{background:var(--panel2)}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;min-height:0}
.b{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.s-critical{background:var(--red);color:#fff;border-color:var(--red)}.s-high{background:var(--amber);color:#1a1200;border-color:var(--amber)}.s-medium{background:transparent;color:var(--amber);border-color:var(--amber)}.s-low{background:var(--panel2);color:var(--mute)}
.b.st{background:var(--panel2)}.b.demo{border-color:var(--amber);color:var(--amber)}.b.ok{border-color:var(--green);color:var(--green)}.b.rk{border-color:var(--amber);color:var(--amber)}.b.od{border-color:var(--red);color:var(--red)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px;align-items:start}.split>.panel.det{position:sticky;top:0;max-height:calc(100vh - 100px);overflow:auto}
.dh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.acts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.desc{margin:6px 0;font-size:13.5px}
dl{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:8px 0}dt{color:var(--mute)}dd{margin:0}
.pv{height:210px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0;background:#dfe5dc}.pv svg{width:100%;height:100%;display:block}
.sub{font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.notice{background:var(--panel2);border-left:4px solid var(--amber);border-radius:6px;padding:8px 10px;font-size:12.5px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}.bar i{display:block;height:14px;background:var(--blue);border-radius:3px;min-width:2px}.bar span:first-child{width:130px;flex:0 0 auto}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px}.cols div{flex:1;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px}
.mp{display:grid;grid-template-columns:260px minmax(0,1fr) 360px;gap:12px;flex:1;min-height:560px}.mp.nol{grid-template-columns:minmax(0,1fr) 360px}
.listcol{overflow:auto;max-height:calc(100vh - 150px);display:flex;flex-direction:column;gap:6px}.qi{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}.qi.sel{border-color:var(--blue)}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300}.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:420px;display:flex;flex-direction:column;gap:12px}.lcard h1{margin:0;font-size:20px}.lcard label{display:flex;flex-direction:column;gap:4px}.lcard input,.lcard select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}.dcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:480px;max-width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.dcard h3{margin:0}.dcard label{display:flex;flex-direction:column;gap:4px}.dcard textarea{min-height:70px;width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px}.opt.dis{opacity:.5}.err{color:var(--red);min-height:16px;font-size:12.5px}
#toast{position:fixed;right:18px;bottom:18px;z-index:400;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:10px 14px;max-width:380px}#toast.bad{border-left-color:var(--red)}
@media(max-width:1100px){.ovg,.split,.mp,.mp.nol{grid-template-columns:1fr}.top input{width:140px}.listcol{max-height:none}.split>.panel.det{position:static;max-height:none}}
@media(max-width:800px){.app{--sw:64px}.nlabel,.sbrand span,.brand2,#pUpd{display:none}}
#login{display:none!important}
</style>
</head>
<body>
<div id="login" class="login"><div class="lcard"><h1>EASE Command Centre</h1><p class="mute" style="margin:0">Authorised staff only.</p>
<div class="notice">Demo sign-in. There is no real authentication here. Real accounts, roles and permissions must be enforced by the backend (see ease-emergency-engine/ README).</div>
<label>Operator name<input id="lName" value="Demo operator" maxlength="40"></label>
<label>Role<select id="lRole"><option>Dispatcher</option><option>Supervisor</option><option>Admin</option><option>Read-only analyst</option></select></label>
<button class="btn primary" id="lGo" type="button">Enter demo</button></div></div>
<div class="app hidden" id="app">
 <aside class="side"><div class="sbrand"><i>EASE</i><span>Command</span></div><nav id="nav" aria-label="Main"></nav></aside>
 <header class="top">
  <button id="sideToggle" type="button" aria-label="Collapse or expand sidebar">☰</button>
  <div class="brand2"><b>EASE</b> Command Centre</div>
  <span class="pill demo" id="pDemo">DEMO DATA</span><span class="pill" id="pConn">Demo (local)</span><span class="pill" id="pUpd">Updated –</span>
  <span class="grow"></span>
  <input id="gSearch" type="search" placeholder="Search incident ID or text  ( / )" aria-label="Search incidents">
  <div class="rel"><button id="bell" type="button" aria-label="Notifications">🔔<span id="bellN" class="dot">0</span></button><div id="notif" class="notif hidden"></div></div>
  <span class="pill" id="pWho"></span><button id="themeBtn" type="button" aria-label="Switch light or dark theme">◐</button><button id="logoutBtn" type="button">Sign out</button>
 </header>
 <main id="main">
  <section class="pg hidden" id="pg-ov"></section><section class="pg hidden" id="pg-queue"></section><section class="pg hidden" id="pg-map"></section>
  <section class="pg hidden" id="pg-dispatch"></section><section class="pg hidden" id="pg-resp"></section><section class="pg hidden" id="pg-fac"></section>
  <section class="pg hidden" id="pg-risk"></section><section class="pg hidden" id="pg-ana"></section><section class="pg hidden" id="pg-audit"></section>
  <section class="pg hidden" id="pg-users"></section><section class="pg hidden" id="pg-set"></section>
 </main>
</div>
<div id="dlg" class="hidden" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dcard"><h3 id="dT"></h3><div id="dB"></div><div class="err" id="dE" role="alert"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="dNo" type="button">Cancel</button><button class="btn primary" id="dOk" type="button">Confirm</button></div></div></div>
<div id="toast" class="hidden" role="status"></div>

 if(a==='reopen'){modal('Reopen '+i.id+'?','<label>Reason (required)<input id="mR" maxlength="300"></label>','Reopen',function(){if(!val('mR'))return 'A reason is required.';var p=i.status;i.status='Under review';i.resolvedAt=null;log(i,'Reopened',val('mR'),p,'Under review');});return;}
 if(RV[a]){var oth2=A().filter(function(o){return o.id!==i.id;});
  modal(RV[a]+': '+i.id,'<p class="mute">Dispatch is not affected by this decision. The original report is preserved.</p>'+(a==='rv-dup'?'<label>Related incident<select id="mL">'+oth2.map(function(o){return '<option value="'+esc(o.id)+'">'+esc(o.id+' · '+o.label)+'</option>';}).join('')+'</select></label>':'')+'<label>Rationale (required)<textarea id="mR" maxlength="600"></textarea></label>','Record decision',function(){
   if(i.review&&i.review.state==='Escalated for supervisor review'&&!can('rview2'))return 'Only a supervisor can decide an escalated review.';if(!val('mR'))return 'A documented rationale is required.';
   var p=i.review?i.review.state:'Pending';i.review={state:RV[a],by:me+' ('+role+')',ts:Date.now(),reason:val('mR'),prev:p};if(a==='rv-dup')i.link=val('mL');log(i,'Risk review: '+RV[a],val('mR'),p,RV[a]);});}
}
function exportCsv(){var L=list(),h='id,received_ist,category,severity,status,assigned_unit,review_state,source\n',c=function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';};
 L.forEach(function(i){h+=[i.id,ist(i.ts),i.label,i.sev,i.status,i.unit||'',i.review?i.review.state:(pend(i)?'Pending':'None'),i.src].map(c).join(',')+'\n';});
 try{var b=new Blob([h],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ease-incidents.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);aud('CSV export','incidents','Filtered view, no contact details or free text');save();toast('Exported '+L.length+' row(s). Contact details and free text are excluded.');}catch(e){toast('Download is blocked in this view.',true);}}
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);}

/* ---------- events ---------- */
$('nav').addEventListener('click',function(e){var g=e.target.closest('[data-go]');if(g)go(g.getAttribute('data-go'));});
$('main').addEventListener('click',function(e){var t=e.target,m=t.closest('.inc');
 if(m){doAct('sel',m.getAttribute('data-id'));return;}
 var z=t.closest('[data-zoom]');if(z){zoom(z.getAttribute('data-zoom'),+z.getAttribute('data-d'));return;}
 var k=t.closest('[data-kpi]');if(k){var K=KP[+k.getAttribute('data-kpi')];if(K[3]){F={cat:'',sev:'',st:'active',asg:'',rev:'',src:'',q:'',sort:'pri',pg:0};for(var x in K[3])F[x]=K[3][x];}go(K[4]);return;}
 var g=t.closest('[data-go]');if(g){go(g.getAttribute('data-go'));return;}
 var a=t.closest('[data-act]');if(a&&!a.disabled)doAct(a.getAttribute('data-act'),a.getAttribute('data-id'),a.getAttribute('data-u'));});
$('main').addEventListener('keydown',function(e){var m=e.target.closest&&e.target.closest('.inc');if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();doAct('sel',m.getAttribute('data-id'));}});
$('main').addEventListener('change',function(e){var t=e.target;
 if(t.hasAttribute('data-f')&&t.getAttribute('data-f')!=='q'){F[t.getAttribute('data-f')]=t.value;F.pg=0;rQueue();return;}
 if(t.hasAttribute('data-mf')){MF[t.getAttribute('data-mf')]=t.value;render();return;}
 if(t.hasAttribute('data-af')){AF[t.getAttribute('data-af')]=t.value;rResp();return;}
 if(t.hasAttribute('data-an')){AF[t.getAttribute('data-an')]=t.value;rAna();return;}
 if(t.getAttribute('data-opt')==='fac'){showFac=t.checked;if(!showFac)mapFac=null;render();return;}
 if(t.hasAttribute('data-unit')){var u=unitById(t.getAttribute('data-unit')),v=t.value;if(!can('unit')){toast('Your role cannot do this.',true);rResp();return;}
  if(['Assigned','En route','On scene'].indexOf(v)>-1&&u.stat!==v){toast('Use Dispatch to assign a unit to an incident.',true);rResp();return;}
  aud('Unit status changed',u.id,'',u.stat,v);u.stat=v;save();render();top();return;}
 if(t.hasAttribute('data-user')){var AU=window.EASE_AUTH,uid2=t.getAttribute('data-user'),au=AU.get(uid2);if(!can('users')||!au){rUsers();return;}if(uid2===(window.EASE_SESSION||{}).uid){toast('You cannot change your own role.',true);rUsers();return;}var pr=au.role,rs=AU.setRole(uid2,t.value);if(!rs.ok){toast(rs.msg,true);rUsers();return;}aud('Role changed',au.ident,'',pr,t.value);save();toast('Role updated.');rUsers();}});
$('main').addEventListener('input',function(e){var t=e.target;
 if(t.getAttribute('data-f')==='q'){F.q=t.value;F.pg=0;$('qTbl').innerHTML=qTable();}
 if(t.hasAttribute('data-aq')){audQ=t.value;var p=t.selectionStart;rAudit();var n=document.querySelector('[data-aq]');n.focus();n.setSelectionRange(p,p);}});
$('sideToggle').addEventListener('click',function(){$('app').classList.toggle('collapsed');});
$('bell').addEventListener('click',function(){$('notif').classList.toggle('hidden');});
$('themeBtn').addEventListener('click',toggleTheme);
$('gSearch').addEventListener('keydown',function(e){if(e.key==='Enter'){F.q=this.value.trim();F.st='all';F.pg=0;go('queue');}});
document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('gSearch').focus();}});
$('lGo').addEventListener('click',function(){me=val('lName')||'Operator';role=$('lRole').value;$('login').classList.add('hidden');$('app').classList.remove('hidden');ingest();buildNav();render();top();});
$('logoutBtn').addEventListener('click',function(){window.EASE_SESSION=null;try{sessionStorage.removeItem('ease.session');}catch(e){}location.reload();});
window.addEventListener('storage',ingest);window.addEventListener('online',top);window.addEventListener('offline',top);
try{var bc=new BroadcastChannel('ease-alerts');bc.onmessage=function(){ingest();};}catch(e){}
setInterval(ingest,3000);setInterval(function(){if($('dlg').classList.contains('hidden')&&!$('app').classList.contains('hidden')){render();top();}},60000);
load();
(function(){var s=window.EASE_SESSION||null;if(!s){try{s=JSON.parse(sessionStorage.getItem('ease.session')||'null');}catch(e){}}if(s&&s.type==='staff'){$('lName').value=s.name;$('lRole').value=s.role;$('lGo').click();}else{document.body.innerHTML='<p style="padding:40px;font-family:sans-serif">Staff sign-in required. Return to the EASE home page.</p>';}})();
})();
